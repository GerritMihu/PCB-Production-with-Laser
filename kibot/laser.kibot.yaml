# KiBot-Export für Laser-Ablation (xTool F2 Ultra, später Trotec Speedy)
# Nur Kupfer + Umriss + Bohrungen – kein Lötstopplack, kein Bestückungsdruck.
# DXF-Einstellungen = bewährter manueller Export (Stiftklavier, 07/2026):
#   Edge.Cuts auf jeder Kupferlage, Polygonmodus, mm, kleine Bohrlochmarkierung
# Aufruf: kibot -c laser.kibot.yaml -b <board>.kicad_pcb -d laser/
kibot:
  version: 1

outputs:
  - name: dxf_laser
    comment: DXF Kupfer + Umriss (Import in xTool Studio)
    type: dxf
    dir: dxf
    layers: [F.Cu, B.Cu]
    options:
      exclude_edge_layer: false
      polygon_mode: true
      metric_units: true
      drill_marks: small
      plot_sheet_reference: false

  - name: dxf_edge
    comment: DXF nur Umriss (Konturschnitt)
    type: dxf
    dir: dxf
    layers: [Edge.Cuts]
    options:
      polygon_mode: true
      metric_units: true
      plot_sheet_reference: false

  - name: gerber_laser
    comment: Gerber Kupfer + Edge.Cuts
    type: gerber
    dir: gerber
    layers: [F.Cu, B.Cu, Edge.Cuts]

  - name: drill_laser
    comment: Bohrdaten (Excellon) + Bohrplan
    type: excellon
    dir: gerber
    options:
      pth_and_npth_single_file: true
      map: pdf

  - name: svg_top
    comment: SVG F.Cu + Umriss, 1:1, auf Platine beschnitten
    type: svg
    dir: svg
    layers: [F.Cu]
    options:
      plot_sheet_reference: false
      exclude_edge_layer: false
      drill_marks: small
      limit_viewbox: true

  - name: svg_bottom
    comment: SVG B.Cu + Umriss, gespiegelt (Platine wird umgedreht)
    type: svg
    dir: svg
    layers: [B.Cu]
    options:
      plot_sheet_reference: false
      exclude_edge_layer: false
      drill_marks: small
      mirror_plot: true
      limit_viewbox: true
